services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""], interval: 5s, timeout: 3s, retries: 10 }
    volumes: ["pgdata:/var/lib/postgresql/data"]
  api:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      APP_ENV: ${APP_ENV:-development}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      DB_SSLMODE: ${DB_SSLMODE:-}
      SESSION_HOURS: ${SESSION_HOURS:-8}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-fieldnote_session}
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-fieldnote_csrf}
      DEBUG: ${DEBUG:-false}
    ports: ["127.0.0.1:8000:8000"]
    depends_on: { db: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"], interval: 10s, timeout: 5s, retries: 5 }
  web:
    build: ./frontend
    ports: ["127.0.0.1:5173:80"]
    depends_on: { api: { condition: service_healthy } }
volumes: { pgdata: }
